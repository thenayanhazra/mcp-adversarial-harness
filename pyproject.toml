[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-redteam"
version = "0.1.0"
description = "Adversarial security harness for Model Context Protocol (MCP) servers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Nayan Hazra" }]
keywords = ["mcp", "security", "red-team", "llm", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=1.0.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "click>=8.1",
    "pydantic>=2.7",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "PyYAML>=6.0",
    "anyio>=4.4",
    "rich>=13.7",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "pyright>=1.1.370",
    "coverage>=7.5",
]

[project.scripts]
mcp-redteam = "mcp_redteam.cli:main"

[project.urls]
Homepage = "https://github.com/thenayanhazra/MCP-Adversarial-Harness"
Issues = "https://github.com/thenayanhazra/MCP-Adversarial-Harness/issues"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = [
    "ANN401",  # Any is deliberate at protocol boundaries
    "E501",    # long strings in payload text and messages
    "UP042",   # keep str+Enum for 3.11 compatibility
    "SIM105",  # explicit try/except reads clearer here
    "SIM201",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pyright]
pythonVersion = "3.11"
strict = true
exclude = ["tests/fixtures/vulnerable_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 120
testpaths = ["tests"]

[tool.coverage.run]
source = ["mcp_redteam"]
omit = ["tests/*"]
